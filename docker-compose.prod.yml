services:
  # ── Auth ────────────────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: fitai-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - fitai-network
    restart: unless-stopped

  # ── Service Registry ─────────────────────────────────────────────────────────

  eureka:
    build: ./eureka/eureka
    container_name: fitai-eureka
    ports:
      - "8761:8761"
    networks:
      - fitai-network
    restart: unless-stopped

  # ── Microservices ────────────────────────────────────────────────────────────

  userservice:
    build: ./userservice/userservice
    container_name: fitai-userservice
    depends_on:
      - eureka
      - keycloak
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8081:8081"
    networks:
      - fitai-network
    restart: unless-stopped

  activityservice:
    build: ./activityservice/activityservice
    container_name: fitai-activityservice
    depends_on:
      - eureka
    environment:
      MONGODB_URI: ${MONGODB_URI}
      RABBITMQ_URI: ${RABBITMQ_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - fitai-network
    restart: unless-stopped

  aiservice:
    build: ./aiservice/aiservice
    container_name: fitai-aiservice
    depends_on:
      - eureka
    environment:
      MONGODB_URI: ${MONGODB_URI}
      RABBITMQ_URI: ${RABBITMQ_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "8083:8083"
    networks:
      - fitai-network
    restart: unless-stopped

  gateway:
    build: ./gateway/gateway
    container_name: fitai-gateway
    depends_on:
      - eureka
      - keycloak
    environment:
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      EUREKA_URL: http://eureka:8761/eureka/
    ports:
      - "9090:9090"
    networks:
      - fitai-network
    restart: unless-stopped

  # ── React Frontend ───────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend/fitai-react
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-fitai-db}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-fitai-frontend}
    container_name: fitai-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - fitai-network
    restart: unless-stopped

networks:
  fitai-network:
    driver: bridge

volumes:
  postgres-data:
